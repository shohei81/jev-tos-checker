<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev ToS Checker</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1c1c1e;
        --muted: #6b6b70;
        --border: #e2e2e6;
        --accent-bg: #f5f5f7;
        --ok: #1a7f37;
        --error: #d93036;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1e;
          --fg: #f2f2f5;
          --muted: #a0a0a8;
          --border: #3a3a3e;
          --accent-bg: #2a2a2e;
          --ok: #4ac26b;
          --error: #ff6b6f;
        }
      }
      body {
        max-width: 560px;
        margin: 40px auto;
        padding: 0 16px;
        font: 15px/1.6 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .lead { color: var(--muted); margin: 0 0 24px; }
      fieldset { border: 0; margin: 0; padding: 0; }
      .option {
        display: block;
        margin-bottom: 12px;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .choice { display: block; cursor: pointer; }
      .option:has(input:checked) { border-color: var(--fg); background: var(--accent-bg); }
      .option-title { font-weight: 600; }
      .option-help { display: block; color: var(--muted); font-size: 13px; margin: 4px 0 0 24px; }
      .field { margin: 12px 0 0 24px; }
      .field[hidden] { display: none; }
      .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
      .field input {
        box-sizing: border-box;
        width: 100%;
        padding: 8px 10px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .field a { display: inline-block; font-size: 13px; margin-top: 4px; color: inherit; }
      .note { color: var(--muted); font-size: 13px; }
      #save {
        padding: 10px 20px;
        font: inherit;
        font-weight: 600;
        color: var(--bg);
        background: var(--fg);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      #save:disabled { opacity: 0.5; cursor: progress; }
      #message.ok { color: var(--ok); }
      #message.error { color: var(--error); }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle"></h1>
    <p class="lead" data-i18n="optionsIntro"></p>
    <form id="form">
      <fieldset>
        <div class="option">
          <label class="choice">
            <input type="radio" name="mode" value="apiKey" checked />
            <span class="option-title" data-i18n="modeApiKey"></span>
            <span class="option-help" data-i18n="modeApiKeyHelp"></span>
          </label>
          <div class="field">
            <label for="apiKey" data-i18n="apiKeyLabel"></label>
            <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
            <a href="https://docs.typesafe.ai/introduction/quickstart" target="_blank" rel="noopener" data-i18n="getApiKeyLink"></a>
          </div>
        </div>
        <div class="option">
          <label class="choice">
            <input type="radio" name="mode" value="server" />
            <span class="option-title" data-i18n="modeServer"></span>
            <span class="option-help" data-i18n="modeServerHelp"></span>
          </label>
          <div class="field" hidden>
            <label for="serverUrl" data-i18n="serverUrlLabel"></label>
            <input id="serverUrl" type="url" placeholder="https://example.workers.dev" spellcheck="false" />
          </div>
        </div>
      </fieldset>
      <p class="note" data-i18n="privacyNote"></p>
      <button id="save" type="submit" data-i18n="saveButton"></button>
      <p id="message" role="status"></p>
    </form>
    <script src="dist/options.js"></script>
  </body>
</html>

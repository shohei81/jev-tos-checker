<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev ToS Checker</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        font-size: 15px;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
        margin: 0 auto;
        padding: 56px 16px 64px;
      }
      .product {
        margin: 0 0 4px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-muted);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.01em;
      }
      .lead {
        margin: 0 0 28px;
        color: var(--ink-muted);
        text-wrap: pretty;
      }

      fieldset {
        margin: 0;
        padding: 0;
        border: 0;
        border-top: 1px solid var(--rule);
      }
      .option {
        padding: 18px 0;
        border-bottom: 1px solid var(--rule);
      }
      .choice {
        display: grid;
        grid-template-columns: 20px 1fr;
        column-gap: 10px;
        cursor: pointer;
      }
      .choice input {
        margin: 4px 0 0;
        width: 16px;
        height: 16px;
        accent-color: var(--ink);
      }
      .option-title { font-weight: 600; }
      .option-help {
        grid-column: 2;
        font-size: 13px;
        color: var(--ink-muted);
      }
      .field { margin: 14px 0 0 30px; }
      .field label {
        display: block;
        margin-bottom: 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .field input {
        width: 100%;
        padding: 9px 11px;
        font: inherit;
        font-size: 14px;
        color: inherit;
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 6px;
      }
      .field input:focus-visible { outline-offset: 0; border-color: var(--ink); }
      .field a {
        display: inline-block;
        margin-top: 6px;
        font-size: 13px;
        color: var(--ink-muted);
        text-underline-offset: 3px;
      }
      .field a:hover { color: var(--ink); }

      .note {
        margin: 20px 0 24px;
        font-size: 13px;
        color: var(--ink-muted);
      }
      #message { margin: 16px 0 0; min-height: 1.6em; }
      #message.ok { color: var(--ok); }
      #message.error { color: var(--red-pen); }
    </style>
  </head>
  <body>
    <main>
      <p class="product" data-i18n="extName"></p>
      <h1 data-i18n="optionsTitle"></h1>
      <p class="lead" data-i18n="optionsIntro"></p>
      <form id="form">
        <fieldset>
          <div class="option">
            <label class="choice">
              <input type="radio" name="mode" value="apiKey" checked />
              <span class="option-title" data-i18n="modeApiKey"></span>
              <span class="option-help" data-i18n="modeApiKeyHelp"></span>
            </label>
            <div class="field">
              <label for="apiKey" data-i18n="apiKeyLabel"></label>
              <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
              <a href="https://docs.typesafe.ai/introduction/quickstart" target="_blank" rel="noopener" data-i18n="getApiKeyLink"></a>
            </div>
          </div>
          <div class="option">
            <label class="choice">
              <input type="radio" name="mode" value="server" />
              <span class="option-title" data-i18n="modeServer"></span>
              <span class="option-help" data-i18n="modeServerHelp"></span>
            </label>
            <div class="field" hidden>
              <label for="serverUrl" data-i18n="serverUrlLabel"></label>
              <input id="serverUrl" type="url" placeholder="https://example.workers.dev" spellcheck="false" />
            </div>
          </div>
        </fieldset>
        <p class="note" data-i18n="privacyNote"></p>
        <button id="save" class="primary" type="submit" data-i18n="saveButton"></button>
        <p id="message" role="status"></p>
      </form>
    </main>
    <script src="dist/options.js"></script>
  </body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jev ToS Checker</title>
    <link rel="stylesheet" href="base.css" />
    <style>
      body {
        width: 380px;
        font-size: 13px;
        line-height: 1.5;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px 0;
      }
      h1 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .icon-button {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        margin-right: -6px;
        padding: 0;
        color: var(--ink-muted);
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .icon-button:hover { color: var(--ink); }

      .intro {
        padding: 12px 16px 16px;
        border-bottom: 1px solid var(--rule);
      }
      .intro p {
        margin: 0 0 12px;
        color: var(--ink-muted);
      }
      .intro .primary { width: 100%; }
      progress {
        display: block;
        width: 100%;
        height: 2px;
        margin-top: 12px;
        appearance: none;
        border: 0;
        background: var(--rule);
      }
      progress::-webkit-progress-bar { background: var(--rule); }
      progress::-webkit-progress-value { background: var(--ink); transition: width 0.2s; }

      #summary {
        margin: 0;
        padding: 16px 16px 4px;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.4;
        text-wrap: pretty;
      }
      #status {
        margin: 0;
        padding: 0 16px;
        color: var(--ink-muted);
      }
      #status:empty { display: none; }
      #status.error { color: var(--red-pen); padding-top: 12px; }

      section { padding: 14px 16px 4px; }
      h2 {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-muted);
      }
      .count { font-weight: 400; font-variant-numeric: tabular-nums; }

      ul { list-style: none; margin: 0; padding: 0; }
      /* 校正記号のように、要注意の条項の左の余白に「!」を置く */
      .clause {
        display: grid;
        grid-template-columns: 12px 1fr;
        column-gap: 10px;
        width: calc(100% + 16px);
        margin: 0 -8px 2px;
        padding: 6px 8px 8px;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
      }
      .clause::before {
        grid-row: 1 / 3;
        font-family: var(--font-text);
        font-size: 16px;
        font-weight: 700;
        line-height: 1.1;
      }
      .clause.high::before { content: "!" / ""; color: var(--red-pen); }
      .clause > * { grid-column: 2; }
      .clause:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
      .verdict {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 2px;
      }
      .high .verdict { color: var(--red-pen); }
      .likelihood { font-weight: 400; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
      .quote {
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-family: var(--font-text);
        font-size: 13.5px;
        line-height: 1.75;
      }

      #clear {
        margin: 8px 16px 0;
        padding-top: 12px;
        border-top: 1px solid var(--rule);
        color: var(--ink-muted);
      }
      #clear strong { font-weight: 600; color: var(--ok); }

      footer {
        margin-top: 12px;
        padding: 10px 16px 14px;
        font-size: 11px;
        color: var(--ink-muted);
        border-top: 1px solid var(--rule);
      }
    </style>
  </head>
  <body>
    <header>
      <h1 data-i18n="extName"></h1>
      <button class="icon-button open-settings" data-i18n-title="settingsLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <div class="intro" id="setup" hidden>
      <p data-i18n="notConfigured"></p>
      <button class="primary open-settings" data-i18n="openSettings"></button>
    </div>
    <div class="intro" id="start" hidden>
      <p id="hint" data-i18n="startHint"></p>
      <button class="primary" id="analyze" data-i18n="analyzeButton"></button>
      <progress id="progress" hidden></progress>
    </div>

    <p id="summary" hidden></p>
    <p id="status" role="status"></p>
    <div id="results"></div>
    <p id="clear" hidden></p>

    <footer data-i18n="disclaimer"></footer>
    <script src="dist/popup.js"></script>
  </body>
</html>
